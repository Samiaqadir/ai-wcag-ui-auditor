<!DOCTYPE html>
<!-- TEST CASE 08: Inline SVG Graphics & Accessible Name Computation -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inline SVG Graphics & Accessible Name Evaluation</title>
  <style>
    body { font-family: sans-serif; padding: 24px; background: #ffffff; color: #0f172a; }
    .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid #94a3b8; border-radius: 6px; background: #f8fafc; cursor: pointer; }
    .icon-btn:focus-visible { outline: 3px solid #2563eb; }
    svg { fill: currentColor; }
  </style>
</head>
<body>
  <header>
    <h1>SVG Graphic Accessibility Suite</h1>
  </header>

  <main>
    <section>
      <h2>Accessible SVG Elements (Expected Compliant)</h2>
      
      <!-- 1. Informative SVG with accessible title and labelledby -->
      <svg role="img" width="120" height="60" aria-labelledby="chart-title chart-desc" viewBox="0 0 120 60">
        <title id="chart-title">Quarterly Revenue Trend</title>
        <desc id="chart-desc">Bar chart showing an upward trajectory from Q1 to Q4 2026.</desc>
        <rect x="10" y="30" width="20" height="30" fill="#2563eb" />
        <rect x="40" y="20" width="20" height="40" fill="#2563eb" />
        <rect x="70" y="10" width="20" height="50" fill="#2563eb" />
      </svg>

      <!-- 2. Decorative SVG explicitly hidden from assistive tech -->
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24">
        <path d="M12 2L2 22h20L12 2z" fill="#f59e0b" />
      </svg>

      <!-- 3. Accessible Button with embedded SVG containing <title> -->
      <button type="button" class="icon-btn" id="btn-print">
        <svg width="20" height="20" viewBox="0 0 20 20">
          <title>Print Document</title>
          <path d="M4 6h12V2H4v4zm12 2H4c-1.1 0-2 .9-2 2v6h4v4h8v-4h4v-6c0-1.1-.9-2-2-2z" />
        </svg>
      </button>

      <!-- 4. Accessible Button with aria-label on the button itself -->
      <button type="button" class="icon-btn" id="btn-search" aria-label="Search database">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20">
          <path d="M12.9 14.32a8 8 0 1 1 1.41-1.41l5.35 5.33-1.42 1.42-5.34-5.34z" />
        </svg>
      </button>
    </section>

    <section>
      <h2>Seeded SVG Accessibility Violations</h2>
      
      <!-- VIOLATION 1: Empty icon button with SVG lacking any title or aria-label [WCAG-4.1.2] -->
      <button type="button" class="icon-btn" id="btn-broken-download">
        <svg width="20" height="20" viewBox="0 0 20 20">
          <path d="M10 2v10m-4-4l4 4 4-4M2 18h16" />
        </svg>
      </button>

      <!-- VIOLATION 2: Seeded missing alt on standard <img> [WCAG-1.1.1] -->
      <div>
        <img src="chart-placeholder.png" width="300" height="150">
      </div>
    </section>
  </main>
</body>
</html>
