<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - DevPlatform</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .auth-card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    /* Fake button styling on a div */
    .btn-fake-button {
      background-color: #2563eb;
      color: #ffffff;
      text-align: center;
      padding: 0.85rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      display: block;
    }
  </style>
</head>
<body>
  <main class="auth-card">
    <h1>Create your account</h1>
    <p style="color: #64748b; margin-bottom: 2rem;">Start building accessible applications today.</p>

    <form id="signup-form" onsubmit="event.preventDefault();">
      
      <!-- SEEDED VIOLATION 1a (WCAG 1.3.1 / 3.3.2): Input relying only on placeholder without label -->
      <div class="form-group">
        <input type="text" id="fullname-input" name="fullname" placeholder="Full legal name">
      </div>

      <!-- SEEDED VIOLATION 1b (WCAG 1.3.1 / 3.3.2): Input relying only on placeholder without label -->
      <div class="form-group">
        <input type="email" id="email-input" name="email" placeholder="work.email@company.com">
      </div>

      <!-- SEEDED VIOLATION 2 (WCAG 2.4.3): Positive tabindex="5" breaks natural keyboard navigation order -->
      <div class="form-group">
        <input type="password" id="password-input" name="password" placeholder="Create secure password" tabindex="5">
      </div>

      <!-- SEEDED VIOLATION 3 (WCAG 4.1.2): role="button" on non-interactive div without tabindex="0" (unfocusable via keyboard) -->
      <div class="form-group" style="margin-top: 1.5rem;">
        <div role="button" id="fake-submit-btn" class="btn-fake-button">
          Sign Up with Workspace
        </div>
      </div>
    </form>
  </main>
</body>
</html>
