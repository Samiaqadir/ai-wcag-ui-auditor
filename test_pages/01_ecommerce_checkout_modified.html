<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout (Modified) - SwiftGear Store</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    /* DELIBERATE REGRESSION 1: Resized container from 800px to 640px */
    .checkout-container {
      max-width: 640px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    /* DELIBERATE REGRESSION 2: Added promotional banner */
    .urgent-promo-banner {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .product-row {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
    }
    .product-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      background: #cbd5e1;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    /* DELIBERATE REGRESSION 3: Shifted CTA position (margin-left: 35px, margin-top: 45px) and altered width */
    .btn-pay-broken {
      background-color: #fef08a;
      color: #9ca3af;
      padding: 0.85rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 85%;
      margin-top: 45px;
      margin-left: 35px;
    }
    /* DELIBERATE REGRESSION 4: New severe low-contrast text (#d1d5db on white) */
    .order-note-regressed {
      color: #d1d5db;
      background-color: #ffffff;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="checkout-container">
    <h1>Express Checkout</h1>

    <!-- REGRESSION: Added DOM Element -->
    <div class="urgent-promo-banner" id="promo-banner">
      ⚡ Flash Sale: 20% off with promo code APPLIED
    </div>

    <section aria-labelledby="order-summary-title">
      <h2 id="order-summary-title">Order Summary</h2>
      
      <!-- Retained first product row -->
      <div class="product-row">
        <img class="product-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' fill='%236366f1'><rect width='100%' height='100%'/></svg>">
        <div>
          <h3>Ultra-Light Wireless Noise Cancelling Headphones</h3>
          <p>Quantity: 1 &bull; $199.00</p>
        </div>
      </div>

      <!-- REGRESSION: Second product row (Braided Fast-Charging USB-C Cable) was intentionally REMOVED -->
    </section>

    <section aria-labelledby="payment-title" style="margin-top: 2rem;">
      <h2 id="payment-title">Payment Details</h2>
      <form id="payment-form" onsubmit="event.preventDefault();">
        
        <div class="form-group">
          <input type="text" id="cardholder-name" class="form-control" placeholder="Cardholder Full Name">
        </div>

        <div class="form-group">
          <input type="text" id="cc-number" class="form-control" placeholder="Credit Card Number (16 digits)">
        </div>

        <div style="display: flex; gap: 1rem;">
          <div class="form-group" style="flex: 1;">
            <input type="text" id="cc-expiry" class="form-control" placeholder="MM/YY">
          </div>
          <div class="form-group" style="flex: 1;">
            <input type="password" id="cc-cvv" class="form-control" placeholder="CVV">
          </div>
        </div>

        <!-- REGRESSION: Shifted and Resized Submit Button -->
        <div class="form-group">
          <button type="submit" id="btn-submit-payment" class="btn-pay-broken">
            Pay Now $199.00
          </button>
        </div>

        <!-- REGRESSION: New Low-contrast note -->
        <p class="order-note-regressed" id="checkout-disclaimer">
          By proceeding you agree to swift automated processing terms.
        </p>
      </form>
    </section>
  </main>
</body>
</html>
