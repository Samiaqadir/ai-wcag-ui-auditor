<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - SwiftGear Store</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .checkout-container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .product-row {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
    }
    .product-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      background: #cbd5e1;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    /* SEEDED VIOLATION: Low Contrast on Pay Now button */
    /* Light gray text #d1d5db on white/light yellow #fef08a: contrast ratio ~ 1.3:1 (WCAG AA requires 4.5:1) */
    .btn-pay-broken {
      background-color: #fef08a;
      color: #9ca3af;
      padding: 0.85rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <main class="checkout-container">
    <h1>Express Checkout</h1>

    <section aria-labelledby="order-summary-title">
      <h2 id="order-summary-title">Order Summary</h2>
      
      <!-- SEEDED VIOLATION 1 (WCAG 1.1.1): Missing alt attribute on product image -->
      <div class="product-row">
        <img class="product-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' fill='%236366f1'><rect width='100%' height='100%'/></svg>">
        <div>
          <h3>Ultra-Light Wireless Noise Cancelling Headphones</h3>
          <p>Quantity: 1 &bull; $199.00</p>
        </div>
      </div>

      <!-- SEEDED VIOLATION 1b (WCAG 1.1.1): Another missing alt attribute -->
      <div class="product-row">
        <img class="product-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' fill='%2310b981'><rect width='100%' height='100%'/></svg>">
        <div>
          <h3>Braided Fast-Charging USB-C Cable (2m)</h3>
          <p>Quantity: 2 &bull; $29.00</p>
        </div>
      </div>
    </section>

    <section aria-labelledby="payment-title" style="margin-top: 2rem;">
      <h2 id="payment-title">Payment Details</h2>
      <form id="payment-form" onsubmit="event.preventDefault();">
        
        <!-- SEEDED VIOLATION 2 (WCAG 1.3.1 / 3.3.2): Missing form label for Cardholder Name -->
        <div class="form-group">
          <!-- Missing <label> or aria-label for input -->
          <input type="text" id="cardholder-name" class="form-control" placeholder="Cardholder Full Name">
        </div>

        <!-- SEEDED VIOLATION 2b (WCAG 1.3.1 / 3.3.2): Missing form label for Card Number -->
        <div class="form-group">
          <!-- Missing <label> or aria-label for input -->
          <input type="text" id="cc-number" class="form-control" placeholder="Credit Card Number (16 digits)">
        </div>

        <div style="display: flex; gap: 1rem;">
          <!-- SEEDED VIOLATION 2c (WCAG 1.3.1 / 3.3.2): Missing form label for Expiry -->
          <div class="form-group" style="flex: 1;">
            <input type="text" id="cc-expiry" class="form-control" placeholder="MM/YY">
          </div>
          <!-- SEEDED VIOLATION 2d (WCAG 1.3.1 / 3.3.2): Missing form label for CVV -->
          <div class="form-group" style="flex: 1;">
            <input type="password" id="cc-cvv" class="form-control" placeholder="CVV">
          </div>
        </div>

        <!-- SEEDED VIOLATION 3 (WCAG 1.4.3): Insufficient Color Contrast < 4.5:1 -->
        <div class="form-group" style="margin-top: 1.5rem;">
          <button type="submit" id="btn-submit-payment" class="btn-pay-broken">
            Pay Now $228.00
          </button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
